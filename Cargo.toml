[package]
name = "simpad-control-panel-rs"
version = "0.1.0"
edition = "2024"
authors = ["Varasina Farmadani <sina@sinanonym.my.id>"]
description = "Cross-platform Linux & Windows Control Panel for SimPad devices written in Rust with Relm4"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
relm4 = { version = "0.11", features = ["libadwaita"] }
gtk4 = { version = "0.11", features = ["v4_10"] }
hidapi = "2.6"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
pretty_assertions = "1.4"
